# Copy to ~/.config/conduit/config.toml and edit as needed.
# Every key can be overridden by an environment variable (see README).

listen = "127.0.0.1:8787"

[anthropic]
base_url = "https://api.anthropic.com"
max_transient_retries = 2

[glm]
base_url = "https://api.z.ai/api/anthropic"
api_key_env = "ZAI_API_KEY"
# Used when the inbound Claude model ID is not in model_map.
default_model = "glm-5.3"

# Rewrite Anthropic model IDs → GLM IDs when the breaker is OPEN.
# Unmapped IDs fall back to default_model above.
[glm.model_map]
"claude-opus-5-5" = "glm-5.3"
"claude-opus-5" = "glm-5.3"
"claude-sonnet-5" = "glm-5.3"
"claude-haiku-4-5" = "glm-5.3-flash"
"claude-opus-4-6" = "glm-5.3"
"claude-sonnet-4-6" = "glm-5.3"
"claude-haiku-4-5-20251001" = "glm-5.3-flash"

# Terminal failover tier: used when Anthropic is quota-open AND GLM fails
# (unreachable, auth, throttle, 5xx). Enabled only when DEEPSEEK_API_KEY is
# set in .env; otherwise this section is inert.
[deepseek]
base_url = "https://api.deepseek.com/anthropic"
api_key_env = "DEEPSEEK_API_KEY"
default_model = "deepseek-v4-flash"
# Optional: claude-* → deepseek model overrides. Unmapped IDs use default_model.
# [deepseek.model_map]
# "claude-opus-5" = "deepseek-reasoner"

[breaker]
fallback_open_seconds = 300
# 0 = disabled. When >0, open the breaker if a *-remaining header drops below this.
proactive_threshold = 0
# Also open when anthropic-ratelimit-unified-*-utilization >= this (0 = disabled).
proactive_utilization = 0.0
probe_on_expiry = true

[log]
level = "info"
capture_upstream_errors = true
capture_path = "~/.local/state/conduit/upstream-errors.jsonl"

[paths]
# Breaker persistence. Empty = $XDG_STATE_HOME/conduit/state.json
# (or ~/.local/state/conduit/state.json).
state_path = ""

# Notifications when failing over to GLM (env toggles; no TOML keys required):
# - macOS/Linux desktop toast (disable with CONDUIT_DESKTOP_NOTIFY=0)
# - one-shot chat notice inside Claude Code on the failover reply
#   (disable with CONDUIT_CHAT_NOTICE=0; disable both with CONDUIT_NOTIFY=0)

# Jev routing mode: per-call provider/model choice via TypeSafe System One.
# Inert unless TYPESAFE_API_KEY is set in .env. Select the mode from the UI
# or POST /_gateway/route {"mode":"jev"}.
[jev]
base_url = "https://api.typesafe.ai/v1/systemone"
api_key_env = "TYPESAFE_API_KEY"
# Jev answer deadline; on timeout the call falls open to auto routing.
timeout_ms = 4000
# How long a decision may be reused within one conversation (lease).
lease_ttl_seconds = 600
# Append-only log of every routing decision. Empty string disables.
decisions_path = "~/.local/state/conduit/decisions.jsonl"

# Candidate catalog. Omit to use the built-in default (opus/sonnet/haiku,
# glm-5.3, glm-5.3-flash, deepseek-v4-flash). Defining any entry replaces
# the whole default list. `profile` is the prior Jev reads when choosing.
# [[jev.catalog]]
# provider = "anthropic"
# model = "claude-sonnet-5"
# profile = "Strong general implementation: cross-file refactors, feature work with clear requirements."
#
# [[jev.catalog]]
# provider = "glm"
# model = "glm-5.3-flash"
# profile = "Lighter tier: mechanical follow-through and simple tool continuations."
